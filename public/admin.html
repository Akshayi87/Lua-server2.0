<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AKSHU MODZ - Admin Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0e27;
            color: #ccd6f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            height: 100vh;
            background: linear-gradient(180deg, #111936 0%, #0a0e27 100%);
            border-right: 1px solid rgba(255,255,255,0.05);
            position: fixed;
            left: 0;
            top: 0;
            padding: 30px 0;
        }
        .logo {
            text-align: center;
            padding: 0 20px 30px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .logo h2 {
            color: #00d4ff;
            font-size: 22px;
            font-weight: 800;
        }
        .logo span {
            color: #5a6a8a;
            font-size: 11px;
            letter-spacing: 2px;
        }
        .nav-menu {
            padding: 20px 15px;
        }
        .nav-item {
            padding: 14px 20px;
            margin: 5px 0;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
        }
        .nav-item:hover, .nav-item.active {
            background: rgba(0,212,255,0.1);
            color: #00d4ff;
        }
        .nav-item i { font-size: 18px; }
        .main-content {
            margin-left: 260px;
            padding: 30px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .header h1 {
            font-size: 28px;
            color: #fff;
        }
        .logout-btn {
            padding: 10px 25px;
            background: rgba(255,71,87,0.1);
            border: 1px solid rgba(255,71,87,0.3);
            color: #ff4757;
            border-radius: 10px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.3s;
        }
        .logout-btn:hover {
            background: rgba(255,71,87,0.2);
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            text-align: center;
        }
        .stat-card h3 {
            font-size: 32px;
            color: #00d4ff;
            margin-bottom: 8px;
        }
        .stat-card p {
            color: #5a6a8a;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .panel {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 20px;
        }
        .panel h3 {
            color: #fff;
            font-size: 18px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .input-row input, .input-row textarea {
            flex: 1;
            padding: 12px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }
        .input-row input:focus, .input-row textarea:focus {
            border-color: #00d4ff;
        }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #00d4ff, #0099cc);
            color: #fff;
        }
        .btn-danger {
            background: rgba(255,71,87,0.1);
            border: 1px solid rgba(255,71,87,0.3);
            color: #ff4757;
        }
        .btn-success {
            background: linear-gradient(135deg, #2ed573, #1e9c52);
            color: #fff;
        }
        .btn:hover { transform: translateY(-2px); }
        .key-list {
            max-height: 300px;
            overflow-y: auto;
        }
        .key-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: rgba(255,255,255,0.03);
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .key-item span {
            font-family: monospace;
            color: #00d4ff;
            font-size: 13px;
        }
        .key-item button {
            padding: 6px 14px;
            background: rgba(255,71,87,0.1);
            border: 1px solid rgba(255,71,87,0.3);
            color: #ff4757;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
        }
        textarea {
            width: 100%;
            min-height: 200px;
            resize: vertical;
            font-family: monospace;
            font-size: 13px;
            line-height: 1.6;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        .status-online { background: rgba(46,213,115,0.1); color: #2ed573; }
        .status-offline { background: rgba(255,71,87,0.1); color: #ff4757; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <h2>🔐 AKSHU MODZ</h2>
            <span>ADMIN PANEL</span>
        </div>
        <div class="nav-menu">
            <div class="nav-item active" onclick="showTab('dashboard')">📊 Dashboard</div>
            <div class="nav-item" onclick="showTab('keys')">🔑 Key Manager</div>
            <div class="nav-item" onclick="showTab('script')">📝 Script Editor</div>
            <div class="nav-item" onclick="showTab('alert')">🔔 Alert Manager</div>
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <h1>Dashboard</h1>
            <a href="/admin/logout" class="logout-btn">Logout</a>
        </div>

        <!-- Dashboard Tab -->
        <div id="dashboard" class="tab-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3 id="totalKeys">0</h3>
                    <p>Total Keys</p>
                </div>
                <div class="stat-card">
                    <h3 id="scriptSize">0</h3>
                    <p>Script Size (chars)</p>
                </div>
                <div class="stat-card">
                    <h3 id="serverStatus">ONLINE</h3>
                    <p>Server Status</p>
                </div>
            </div>
            <div class="panel">
                <h3>⚡ Server Control</h3>
                <button class="btn btn-danger" onclick="toggleServer()">Toggle Server Status</button>
                <span id="statusBadge" class="status-badge status-online" style="margin-left:15px;">ONLINE</span>
            </div>
        </div>

        <!-- Keys Tab -->
        <div id="keys" class="tab-content hidden">
            <div class="panel">
                <h3>🔑 Add New Key</h3>
                <div class="input-row">
                    <input type="text" id="newKey" placeholder="Enter key to add...">
                    <button class="btn btn-success" onclick="addKey()">Add Key</button>
                </div>
            </div>
            <div class="panel">
                <h3>📋 Active Keys</h3>
                <div class="key-list" id="keyList"></div>
            </div>
        </div>

        <!-- Script Tab -->
        <div id="script" class="tab-content hidden">
            <div class="panel">
                <h3>📝 Lua Script Editor</h3>
                <textarea id="scriptEditor" placeholder="-- Enter your Lua script here...">gg.toast("✅ AKSHU MOD - Welcome!")</textarea>
                <div style="margin-top:15px;">
                    <button class="btn btn-primary" onclick="saveScript()">💾 Save Script</button>
                    <span id="scriptMsg" style="margin-left:15px;color:#2ed573;"></span>
                </div>
            </div>
        </div>

        <!-- Alert Tab -->
        <div id="alert" class="tab-content hidden">
            <div class="panel">
                <h3>🔔 Alert Message</h3>
                <textarea id="alertEditor" placeholder="Enter alert message..." style="min-height:80px;"></textarea>
                <div style="margin-top:15px;">
                    <button class="btn btn-primary" onclick="saveAlert()">💾 Save Alert</button>
                    <span id="alertMsg" style="margin-left:15px;color:#2ed573;"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.getElementById(tabId).classList.remove('hidden');
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            if(tabId === 'keys') loadKeys();
            if(tabId === 'script') loadScript();
            if(tabId === 'alert') loadAlert();
        }

        async function loadStatus() {
            const res = await fetch('/admin/api/status');
            const data = await res.json();
            document.getElementById('totalKeys').textContent = data.totalKeys;
            document.getElementById('scriptSize').textContent = data.scriptLength;
            document.getElementById('serverStatus').textContent = data.enabled ? 'ONLINE' : 'OFFLINE';
            const badge = document.getElementById('statusBadge');
            badge.textContent = data.enabled ? 'ONLINE' : 'OFFLINE';
            badge.className = 'status-badge ' + (data.enabled ? 'status-online' : 'status-offline');
        }

        async function toggleServer() {
            await fetch('/admin/api/toggle', { method: 'POST' });
            loadStatus();
        }

        async function loadKeys() {
            const res = await fetch('/admin/api/keys');
            const data = await res.json();
            const list = document.getElementById('keyList');
            list.innerHTML = data.keys.map(k => `
                <div class="key-item">
                    <span>${k}</span>
                    <button onclick="removeKey('${k}')">Remove</button>
                </div>
            `).join('');
        }

        async function addKey() {
            const key = document.getElementById('newKey').value.trim();
            if(!key) return;
            await fetch('/admin/api/keys', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ key })
            });
            document.getElementById('newKey').value = '';
            loadKeys();
            loadStatus();
        }

        async function removeKey(key) {
            await fetch('/admin/api/keys/' + encodeURIComponent(key), { method: 'DELETE' });
            loadKeys();
            loadStatus();
        }

        async function loadScript() {
            const res = await fetch('/admin/api/script');
            const data = await res.json();
            document.getElementById('scriptEditor').value = data.script;
        }

        async function saveScript() {
            const script = document.getElementById('scriptEditor').value;
            await fetch('/admin/api/script', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ script })
            });
            document.getElementById('scriptMsg').textContent = '✅ Saved!';
            setTimeout(() => document.getElementById('scriptMsg').textContent = '', 2000);
            loadStatus();
        }

        async function loadAlert() {
            const res = await fetch('/admin/api/alert');
            const data = await res.json();
            document.getElementById('alertEditor').value = data.alert;
        }

        async function saveAlert() {
            const alert = document.getElementById('alertEditor').value;
            await fetch('/admin/api/alert', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ alert })
            });
            document.getElementById('alertMsg').textContent = '✅ Saved!';
            setTimeout(() => document.getElementById('alertMsg').textContent = '', 2000);
        }

        // Load initial data
        loadStatus();
    </script>
</body>
</html>
